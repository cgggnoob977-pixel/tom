      <div class="sidebar-bottom">
        <div class="sidebar-note">
          <span class="live-dot"></span>
          <div><strong>ข้อมูลพร้อมใช้งาน</strong><small>ทำงานบนอุปกรณ์นี้</small></div>

        <div class="profile">
          <span class="profile-avatar">FF</span>
